<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>

  <!-- PWA metadata -->
  <meta name="description" content="Aplikasi Absensi MGMP Bahasa Inggris Kabupaten Probolinggo"/>
  <meta name="theme-color" content="#1a73e8"/>
  <meta name="application-name" content="Absensi MGMP"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Absensi MGMP"/>
  <meta name="mobile-web-app-capable" content="yes"/>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json"/>

  <!-- Icons -->
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"/>
  <link rel="mask-icon" href="icons/icon-512.png" color="#1a73e8"/>

  <title>Absensi MGMP — Kabupaten Probolinggo</title>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #1a73e8;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* Loading screen awal (akan hilang setelah iframe load) */
    .splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1a73e8 0%, #4285f4 50%, #1a73e8 100%);
      color: #fff; text-align: center;
      z-index: 10;
      transition: opacity .4s ease;
      overflow: hidden;
    }
    .splash::before {
      content: "";
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.15) 0%, transparent 50%),
                  radial-gradient(circle at 70% 70%, rgba(255,255,255,.10) 0%, transparent 50%);
      animation: bgshift 8s ease-in-out infinite alternate;
    }
    .splash::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      animation: progress 2s ease-in-out infinite;
    }
    @keyframes bgshift { 0% { transform: translate(0, 0); } 100% { transform: translate(-5%, -5%); } }
    @keyframes progress {
      0%   { transform: translateX(-100%); opacity: 0; }
      50%  { opacity: 1; }
      100% { transform: translateX(100%); opacity: 0; }
    }
    .splash.hide { opacity: 0; pointer-events: none; }
    .splash .logo-circle {
      width: 120px; height: 120px;
      border-radius: 50%;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.5rem;
      box-shadow: 0 12px 40px rgba(0,0,0,.35), 0 0 0 4px rgba(255,255,255,.25);
      animation: pulse 1.8s ease-in-out infinite;
      position: relative;
      z-index: 2;
    }
    .splash .logo-circle img {
      width: 92%; height: 92%;
      border-radius: 50%;
      object-fit: cover;
    }
    .splash h1 {
      margin: 0 0 .25rem;
      font-size: 1.5rem; font-weight: 700;
      letter-spacing: .5px;
      text-shadow: 0 2px 8px rgba(0,0,0,.2);
      position: relative; z-index: 2;
    }
    .splash .subtitle {
      margin: 0 0 .25rem;
      opacity: .95; font-size: .75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      position: relative; z-index: 2;
    }
    .splash p {
      margin: 0; opacity: .85; font-size: .8rem;
      max-width: 280px;
      line-height: 1.3;
      position: relative; z-index: 2;
    }
    .splash .spinner {
      margin-top: 1.75rem;
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      position: relative; z-index: 2;
    }
    .splash .version {
      position: absolute;
      bottom: 16px; left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      opacity: .6;
      z-index: 2;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes spin  { to { transform: rotate(360deg); } }

    /* Iframe container */
    .iframe-container {
      width: 100%; height: 100dvh;
      overflow: hidden; position: relative;
      background: #fff;
    }
    iframe {
      display: block;
      width: 100%; height: 100%;
      border: none;
    }

    /* Fallback bila iframe gagal dimuat */
    .fallback {
      display: none;
      position: absolute; inset: 0;
      flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 1.5rem;
      color: #333; background: #f5f5f5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .fallback.active { display: flex; }
    .fallback h2 { margin: 0 0 .5rem; color: #1a73e8; }
    .fallback p  { margin: .25rem 0; max-width: 360px; }
    .fallback a {
      margin-top: 1rem; padding: .65rem 1.4rem;
      background: #1a73e8; color: #fff;
      text-decoration: none; border-radius: 8px;
      font-weight: 500;
    }
    .fallback a:active { transform: scale(.97); }

    /* Install prompt banner */
    .install-banner {
      position: fixed; bottom: 16px; left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: #1a73e8; color: #fff;
      padding: .75rem 1rem; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      display: flex; align-items: center; gap: .75rem;
      max-width: 92vw; z-index: 20;
      transition: transform .35s ease;
    }
    .install-banner.show { transform: translateX(-50%) translateY(0); }
    .install-banner .txt { font-size: .85rem; line-height: 1.3; }
    .install-banner button {
      border: none; cursor: pointer;
      padding: .5rem .9rem; border-radius: 6px;
      font-weight: 600; font-size: .85rem;
    }
    .install-banner .btn-install { background: #fff; color: #1a73e8; }
    .install-banner .btn-dismiss { background: transparent; color: #fff; padding: .5rem; }
  </style>
</head>
<body>
  <!-- Splash screen (loading awal) -->
  <div class="splash" id="splash">
    <div class="logo-circle">
      <img src="icons/icon-192.png" alt="Logo MGMP"/>
    </div>
    <div class="subtitle">MGMP Bahasa Inggris</div>
    <h1>Absensi MGMP</h1>
    <p>Kabupaten Probolinggo</p>
    <div class="spinner"></div>
    <div class="version">v1.0.0 · FISKLOPEDIA</div>
  </div>

  <div class="iframe-container">
    <iframe
      id="app"
      title="Absensi MGMP Bahasa Inggris Kabupaten Probolinggo"
      src="https://script.google.com/macros/s/AKfycbzHhagqHeRuPz-4cRerSHmEmX3mbamcOlEzIFLSwkIcUIxhDgQnFQQWMW5l1MDuWOz8JQ/exec"
      scrolling="yes"
      allowfullscreen="true"
      allow="fullscreen; camera; geolocation;"
      loading="eager"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>

    <noscript>
      <div class="fallback active">
        <h2>JavaScript Diperlukan</h2>
        <p>Mohon aktifkan JavaScript di peramban Anda untuk mengakses Absensi MGMP.</p>
      </div>
    </noscript>

    <div class="fallback" id="fallback">
      <h2>Gagal Memuat Aplikasi</h2>
      <p>Periksa koneksi internet Anda lalu coba lagi.</p>
      <a href="javascript:location.reload()">Muat Ulang</a>
    </div>
  </div>

  <!-- Install banner PWA -->
  <div class="install-banner" id="installBanner">
    <div class="txt">
      <strong>Pasang Absensi MGMP</strong><br/>
      <span style="opacity:.85">Akses lebih cepat dari layar utama</span>
    </div>
    <button class="btn-install" id="btnInstall">Pasang</button>
    <button class="btn-dismiss" id="btnDismiss" aria-label="Tutup">✕</button>
  </div>

  <script>
    (function () {
      "use strict";

      /* ---------- Splash control ---------- */
      var splash = document.getElementById("splash");
      var iframe = document.getElementById("app");
      var fallback = document.getElementById("fallback");
      var iframeLoaded = false;

      // Sembunyikan splash saat iframe selesai dimuat
      iframe.addEventListener("load", function () {
        iframeLoaded = true;
        splash.classList.add("hide");
        setTimeout(function () { splash.style.display = "none"; }, 500);
      });

      // Fallback: jika iframe belum load dalam 15 detik
      setTimeout(function () {
        if (!iframeLoaded) {
          splash.style.display = "none";
          fallback.classList.add("active");
        }
      }, 15000);

      /* ---------- Service Worker registration ---------- */
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("sw.js", { scope: "./" })
            .then(function (reg) {
              console.log("[PWA] SW registered with scope:", reg.scope);

              // Cek update SW
              reg.addEventListener("updatefound", function () {
                var newWorker = reg.installing;
                newWorker.addEventListener("statechange", function () {
                  if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                    // SW baru siap — reload otomatis
                    newWorker.postMessage({ type: "SKIP_WAITING" });
                    window.location.reload();
                  }
                });
              });
            })
            .catch(function (err) {
              console.warn("[PWA] SW registration failed:", err);
            });
        });
      }

      /* ---------- PWA Install Prompt (beforeinstallprompt) ---------- */
      var deferredPrompt = null;
      var installBanner = document.getElementById("installBanner");
      var btnInstall    = document.getElementById("btnInstall");
      var btnDismiss    = document.getElementById("btnDismiss");

      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferredPrompt = e;
        // Tampilkan banner setelah 3 detik di halaman
        setTimeout(function () {
          installBanner.classList.add("show");
        }, 3000);
      });

      btnInstall.addEventListener("click", function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function (choice) {
          if (choice.outcome === "accepted") {
            console.log("[PWA] User accepted install");
          } else {
            console.log("[PWA] User dismissed install");
          }
          deferredPrompt = null;
          installBanner.classList.remove("show");
        });
      });

      btnDismiss.addEventListener("click", function () {
        installBanner.classList.remove("show");
      });

      window.addEventListener("appinstalled", function () {
        console.log("[PWA] App installed successfully");
        installBanner.classList.remove("show");
      });

      /* ---------- Deteksi mode standalone ---------- */
      if (window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true) {
        console.log("[PWA] Running as installed PWA");
      }
    })();
  </script>
</body>
</html>
