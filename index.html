<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />

  <!-- Primary Meta Tags -->
  <title>E-ABSENSI MGMP BHS INGGRIS</title>
  <meta name="title" content="E-ABSENSI MGMP BHS INGGRIS" />
  <meta name="description" content="E-Absensi MGMP Bahasa Inggris — aplikasi presensi digital guru MGMP." />
  <meta name="author" content="MGMP Bhs Inggris" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="E-ABSENSI MGMP BHS INGGRIS" />
  <meta property="og:description" content="Aplikasi presensi digital MGMP Bahasa Inggris." />
  <meta property="og:locale" content="id_ID" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Favicon (URL sudah diperbaiki dari typo 'hhttps') -->
  <link rel="icon" type="image/png" href="https://www.image2url.com/r2/default/images/1792900142888-a0b7d18e-5da6-4245-b368-3dcc63ec7f38.png" />
  <link rel="apple-touch-icon" href="https://www.image2url.com/r2/default/images/1792900142888-a0b7d18e-5da6-4245-b368-3dcc63ec7f38.png" />

  <!-- Performance hints: preconnect ke Google Apps Script -->
  <link rel="preconnect" href="https://script.google.com" crossorigin />
  <link rel="dns-prefetch" href="https://script.google.com" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      overflow: hidden;
    }

    .iframe-container {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      position: relative;
      /* Dukungan iPhone notch / safe-area */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-sizing: border-box;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Layar loading */
    #loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      justify-content: center;
      color: #a5b4fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      letter-spacing: .2em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      transition: opacity .5s;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    #loader.done {
      opacity: 0;
      pointer-events: none;
    }

    #loader .dots {
      display: flex;
      gap: 10px;
    }

    #loader .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #818cf8;
      animation: bounce 1.1s infinite ease-in-out;
    }

    #loader .dot:nth-child(2) { animation-delay: -.15s; }
    #loader .dot:nth-child(3) { animation-delay: -.3s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    /* Tampilan error / fallback */
    #loader.error {
      background: linear-gradient(135deg, #1f1015, #2b0f1a);
      color: #fecaca;
    }

    #loader.error .dot { background: #f87171; animation: none; }

    #loader a {
      color: #818cf8;
      text-decoration: underline;
      word-break: break-all;
      font-size: 12px;
      letter-spacing: normal;
      text-transform: none;
    }

    #loader .retry-btn {
      margin-top: 18px;
      padding: 10px 22px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      letter-spacing: .15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s;
    }

    #loader .retry-btn:hover { background: #4338ca; }

    /* Fallback noscript */
    .noscript-fallback {
      padding: 32px;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background: #0f172a;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .noscript-fallback a { color: #818cf8; }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      title="E-Absensi MGMP Bahasa Inggris"
      src="https://script.google.com/macros/s/AKfycbzHhagqHeRuPz-4cRerSHmEmX3mbamcOlEzIFLSwkIcUIxhDgQnFQQWMW5l1MDuWOz8JQ/exec"
      allow="fullscreen; clipboard-read; clipboard-write; autoplay; encrypted-media"
      referrerpolicy="no-referrer-when-downgrade"
      loading="eager">
    </iframe>

    <div id="loader" role="status" aria-live="polite">
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div>Memuat aplikasi…</div>
    </div>
  </div>

  <noscript>
    <div class="noscript-fallback">
      <h1>E-ABSENSI MGMP BHS INGGRIS</h1>
      <p>Aplikasi memerlukan JavaScript untuk berjalan.</p>
      <p>Aktifkan JavaScript pada browser Anda, atau buka aplikasi langsung via tautan berikut:</p>
      <p>
        <a href="https://script.google.com/macros/s/AKfycbzHhagqHeRuPz-4cRerSHmEmX3mbamcOlEzIFLSwkIcUIxhDgQnFQQWMW5l1MDuWOz8JQ/exec">Buka Aplikasi E-Absensi →</a>
      </p>
    </div>
  </noscript>

  <script>
    (function () {
      var iframe = document.getElementById('app');
      var loader = document.getElementById('loader');
      var APP_URL = iframe.src;
      var LOADER_TIMEOUT_MS = 12000; // 12 detik

      function hideLoader() {
        loader.classList.add('done');
      }

      function showError(message) {
        loader.classList.add('error');
        loader.innerHTML =
          '<div style="font-size:13px;letter-spacing:.1em;text-transform:uppercase">Gagal Memuat</div>' +
          '<div style="font-size:12px;letter-spacing:normal;text-transform:none;max-width:420px;line-height:1.6">' +
            message +
          '</div>' +
          '<a href="' + APP_URL + '" target="_blank" rel="noopener">Buka aplikasi langsung di tab baru →</a>' +
          '<button class="retry-btn" type="button" onclick="location.reload()">Coba lagi</button>';
      }

      // Berhasil dimuat
      iframe.addEventListener('load', function () {
        // Cek apakah iframe benar-benar berisi konten (bukan blank karena X-Frame-Options)
        try {
          // Akses contentDocument akan throw jika cross-origin diblokir — itu normal & OK
          var doc = iframe.contentDocument || iframe.contentWindow.document;
          if (doc && doc.readyState === 'complete') {
            hideLoader();
          } else {
            hideLoader();
          }
        } catch (e) {
          // Cross-origin: tidak bisa inspeksi, asumsikan sukses
          hideLoader();
        }
      });

      // Error event (jarang trigger pada cross-origin iframe, tapi tetap didaftarkan)
      iframe.addEventListener('error', function () {
        showError('Aplikasi tidak dapat dimuat di dalam halaman ini.');
      });

      // Timeout: jika setelah 12 detik loader belum hilang, tampilkan fallback
      setTimeout(function () {
        if (!loader.classList.contains('done') && !loader.classList.contains('error')) {
          showError('Aplikasi membutuhkan waktu lama untuk dimuat. ' +
                    'Jika berulang, kemungkinan Google Apps Script memblokir embedding (X-Frame-Options).');
        }
      }, LOADER_TIMEOUT_MS);

      // Deteksi offline
      window.addEventListener('offline', function () {
        showError('Koneksi internet terputus. Periksa jaringan Anda lalu coba lagi.');
      });
    })();
  </script>
</body>
</html>
